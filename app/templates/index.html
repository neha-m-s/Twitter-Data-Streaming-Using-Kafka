<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitter Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f9fa; padding: 20px; }
        h1 { color: #1da1f2; }
        .tweet {
            background: #fff;
            border-left: 4px solid #1da1f2;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .meta {
            font-size: 0.9em;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>📊 Live Twitter Dashboard</h1>
    <div id="tweets">Loading tweets...</div>

    <script>
        async function fetchTweets() {
            const res = await fetch('/api/tweets');
            const tweets = await res.json();
            const container = document.getElementById('tweets');
            container.innerHTML = '';

            tweets.forEach(tweet => {
                const div = document.createElement('div');
                div.className = 'tweet';
                div.innerHTML = `
                    <p>${tweet.tweet_text}</p>
                    <div class="meta">👤 ${tweet.user_name || 'Unknown'} | 🕒 ${tweet.created_at}</div>
                `;
                container.appendChild(div);
            });
        }

        fetchTweets();
        setInterval(fetchTweets, 5000); // refresh every 5 sec
    </script>
</body>
</html>
